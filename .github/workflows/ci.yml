name: CI

on:
  # Every branch, so work in progress is tested before a PR is opened.
  push:
    branches: ["**"]
  pull_request:
  # Manual run on any branch: Actions -> CI -> Run workflow, or
  # `gh workflow run CI --ref <branch>`. GitHub only offers this once this
  # file is on the default branch.
  workflow_dispatch:

# A branch with an open PR gets both a push and a pull_request run for the
# same commit; keep only the newest run per branch.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── test matrix ──────────────────────────────────────────────────────────────
  #
  # Four platforms covering distinct SIMD stories:
  #   ubuntu-latest      → x86_64 Linux   (SSE2 / SSSE3 / AVX2)
  #   ubuntu-24.04-arm   → AArch64 Linux  (NEON)
  #   macos-latest       → AArch64 macOS  (NEON — Apple Silicon)
  #   windows-latest     → x86_64 Windows (SSE2 / SSSE3 / AVX2)

  test:
    name: test / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ── feature matrix ──────────────────────────────────────────────────────

      - name: Test — default features (scalar path)
        run: cargo test

      - name: Test — simd-auto (runtime detection, best available path)
        run: cargo test --features simd-auto

      # x86_64 only: forced compile-time SIMD paths
      - name: Test — simd-ssse3 (forced SSSE3)
        if: runner.arch == 'X64'
        run: cargo test --features simd-ssse3

      - name: Test — simd-avx2 (forced AVX2)
        if: runner.arch == 'X64'
        run: cargo test --features simd-avx2

      # AArch64 only: forced NEON path
      - name: Test — simd-neon (forced NEON)
        if: runner.arch == 'ARM64'
        run: cargo test --features simd-neon

      # no_std + alloc: all platforms
      - name: Test — no_std + alloc
        run: cargo test --no-default-features --features alloc

      # simd-auto without std has no runtime detection on x86_64 and must fall
      # back to scalar; on AArch64 it still uses NEON.
      - name: Test — no_std + alloc + simd-auto
        run: cargo test --no-default-features --features alloc,simd-auto

      # no_std without alloc: only the slice API is built. The test targets
      # that use the Vec API declare required-features and are skipped, which
      # leaves tests/no_alloc.rs. Doctests need alloc, so they are not run.
      - name: Test — no_std, no alloc
        run: cargo test --no-default-features --tests

      - name: Test — no_std, no alloc + simd-auto
        run: cargo test --no-default-features --features simd-auto --tests

      - name: Test — no_std, no alloc + simd-avx2 (forced AVX2)
        if: runner.arch == 'X64'
        run: cargo test --no-default-features --features simd-avx2 --tests

      - name: Test — no_std, no alloc + simd-neon (forced NEON)
        if: runner.arch == 'ARM64'
        run: cargo test --no-default-features --features simd-neon --tests

  # ── lint ─────────────────────────────────────────────────────────────────────

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      # simd-auto activates all SIMD code paths so clippy sees everything;
      # --all-targets extends the lint to tests and benches.
      - name: clippy
        run: cargo clippy --features simd-auto --all-targets -- -D clippy::all

      - name: clippy (no_std, no alloc)
        run: cargo clippy --no-default-features --all-targets -- -D clippy::all

  # ── MSRV ─────────────────────────────────────────────────────────────────────

  msrv:
    name: MSRV (1.87.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.87.0

      - uses: Swatinem/rust-cache@v2

      - name: Test — default features
        run: cargo test

      - name: Test — simd-auto
        run: cargo test --features simd-auto
